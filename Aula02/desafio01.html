<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- TAG DO MEU SITE-->

    <meta name="description" content="Esse é uma pagina modelo">

    <title> Manipulando elemento</title>
</head>

<body>
    <h1><mark> MANIPULAMDO ELEMENTO (TAGS)</mark> ATRAVES DO JAVA SCRIPT</h1>
    <hr>
    <div>
        <p> estamos aprendendo js</p>
        <p>aprender e bom</p>
        <p> e para ajudar o aprendizado, é PRECISO praticar e exercitar</p>
    </div>

    <script>
        const tags_p = document.getElementsByTagName('p')
        console.log(tags_p);
        let tags_p_1 = tags_p[0];
        console.log(tags_p_1);
        tags_p_1.style.background = "purple"
        tags_p_1.style.color = "white"
        tags_p_1.style.textAlign = "center"


        let tags_p_2 = tags_p[1];
        console.log(tag_p_2);
        tags_p_2.style.background = "purple"
        tags_p_2.style.color = "white"
        tags_p_2.style.textAlign = "center"
        tags_p_2.style.backgroundColor = "red"


        let tags_p_3 = tags_p[2];
        console.log(tags_p_3);
        tags_p_3.style.background = "purple"
        tags_p_3.style.color = "white"
        tags_p_3.style.textAlign = "center"
        tags_p_3.style.backgroundColor = "blue"

        
        const tags_div=document.getElementsByTagName('div')
        console.log(tags_div);
        let tag_div_1 = tags_div[0];

        tag_div_1.style.color = "white"
        tag_div_1.style.textAlign = "center"
        tag_div_1.style.backgroundColor = "orange"




    </script>
</body>

</html>
