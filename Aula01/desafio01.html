<body>
    <h1> Integrando os recursos de interatividade do JS <mark>ALERT</mark></h1>
    <script>
        window.alert("desafio 01")
     let num1 = parseFloat(prompt("Digite o primeiro número:"));
     let num2 = parseFloat(prompt("Digite o segundo número:"));
     let operacao = prompt("Digite a operação desejada: (+) SOMA ou (-) SUBTRAÇÃO");
      if (operacao === "+") {
            resultado = num1 + num2;
            alert("O resultado da soma é: " + resultado);
        } else if (operacao === "-") {
            resultado = num1 - num2;
            alert("O resultado da subtração é: " + resultado);
        } else {
            alert("Operação Errada Por favor, digite + ou -");
        }
    </script>
</body>
