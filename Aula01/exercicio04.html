<body>
    <h1> Integrando os recursos de interatividade do JS <mark>ALERT</mark></h1>
    <script>
        window.alert("Seja bem-vindo ao site");
        let nome = window.prompt("QUAL É O SEU NOME? ");
        console.log(nome);
        let resposta = window.prompt("Você deseja sair da página?  ");
        console.log(resposta);
        if (resposta == true) {
            setTimeout(() => {
                window.close()
            }, 3000); //  3000 milisegundos = 3 segundos 
        } else {
            window.alert("Aproveite o meu site, " + nome)
        }
    </script>
</body>
